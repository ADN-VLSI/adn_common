name: update_doc_list

on: [push]

jobs:
  check_foez_bhai:
    name: Check for @foez-bhai text
    runs-on: [adn]
    outputs:
      has_foez_bhai: ${{ steps.check.outputs.has_foez_bhai }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADN_SECRET_FOEZ_PAT }}

      - name: Check for @foez-bhai text in files
        id: check
        shell: bash
        run: |
          set -euo pipefail
          
          # Search for "@foez-bhai" in all files except .git and .github directories
          if grep -r "@foez-bhai" --exclude-dir=.git --exclude-dir=.github . 2>/dev/null | grep -q .; then
            echo "has_foez_bhai=true" >> "$GITHUB_OUTPUT"
            echo "Found '@foez-bhai' in repository files"
          else
            echo "has_foez_bhai=false" >> "$GITHUB_OUTPUT"
            echo "No '@foez-bhai' text found in repository files"
          fi

  update_doc_list:
    name: Update Documentations & Lists
    needs: check_foez_bhai
    if: needs.check_foez_bhai.outputs.has_foez_bhai == 'false'
    runs-on: [adn]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADN_SECRET_FOEZ_PAT }}

      - name: Update Documentations & Lists
        shell: bash
        run: |
          git submodule update --init --recursive --depth 1
          make update_doc_list

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Foez Ahmed"
          git config user.email "foez.official@gmail.com"

          rm -f tagged-files.txt

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Process foez-bhai tagged files" || true
          git push origin HEAD
