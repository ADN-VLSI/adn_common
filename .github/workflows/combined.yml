name: Combined CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Gate job - runs first, provides baseline state (never pushes)
  gate:
    name: Gate (baseline state)
    runs-on: [adn]
    outputs:
      changed: ${{ steps.set.outputs.changed }}
    steps:
      - id: set
        run: echo "changed=false" >> "$GITHUB_OUTPUT"

  # Job 1: Process tags - only depends on gate
  # Condition: skip if gate changed (never happens, but pattern for consistency)
  process-tags:
    name: Process foez-bhai tagged files
    runs-on: [review]
    needs: gate
    if: ${{ needs.gate.outputs.changed != 'true' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADN_SECRET_FOEZ_PAT }}

      - name: Find tagged files
        id: tagged-files
        shell: bash
        run: |
          set -euo pipefail

          directive_regex='^[[:space:]]*(//|#|--|/\*+|\*+)?[[:space:]]*@foez-bhai\b'
          workflow_file="./.github/workflows/foez-bhai-tag.yml"
          mapfile -d '' files < <(
            grep -RIlZ --exclude-dir=.git --exclude-dir=.github -E "$directive_regex" . |
              while IFS= read -r -d '' file; do
                if [ "$file" != "$workflow_file" ]; then
                  printf '%s\0' "$file"
                fi
              done || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No matching tags found."
            exit 0
          fi

          printf '%s\0' "${files[@]}" > tagged-files.txt
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          printf 'Found %s tagged file(s).\n' "${#files[@]}"

      - name: Process tagged files
        if: steps.tagged-files.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          branch_name="foez-bhai-automation/${GITHUB_REF_NAME}"
          git switch -c "$branch_name" || git switch -c "$branch_name"

          while IFS= read -r -d '' file; do
            python .github/gemini.py "$file" --api-key "${{ secrets.FOEZ_SECRET_API_KEY }}" -o output.foez
            mv output.foez "$file"
            echo "" >> "$file"
            rm -rf __pycache__
          done < tagged-files.txt

          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_ENV"

      - name: Commit and push changes
        if: steps.tagged-files.outputs.found == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Foez Ahmed"
          git config user.email "foez.official@gmail.com"

          rm -f tagged-files.txt

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Process foez-bhai tagged files"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.tagged-files.outputs.found == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADN_SECRET_FOEZ_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          declare -a head_candidates=(
            "${BRANCH_NAME}"
            "${repo_owner}:${BRANCH_NAME}"
            "${GITHUB_ACTOR}:${BRANCH_NAME}"
          )

          pr_url=""
          for head in "${head_candidates[@]}"; do
            echo "Trying to create PR with head=${head} base=${GITHUB_REF_NAME}"
            if pr_url=$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${head}" \
              --title "Process foez-bhai tagged files for branch ${GITHUB_REF_NAME}" \
              --body "This PR was created automatically after finding matching tags in the repository for each tagged file." 2>gh-pr-create.err); then
              break
            fi

            echo "gh pr create failed for head=${head}"
            sed -n '1,20p' gh-pr-create.err
          done

          if [ -z "${pr_url}" ]; then
            echo "Failed to create PR after trying all head candidates."
            exit 1
          fi

          echo "Created PR: ${pr_url}"
          rm -f gh-pr-create.err

          if [ "${GITHUB_ACTOR}" != "foez.ahmed" ]; then
            if gh pr edit "$pr_url" --add-reviewer "${GITHUB_ACTOR}"; then
              echo "Requested review from ${GITHUB_ACTOR}."
            else
              echo "Could not request review from ${GITHUB_ACTOR}; continuing without reviewer assignment."
            fi
          else
            echo "Skipping reviewer assignment because the PR author and actor are the same user."
          fi

  # Job 2: Update doc list - depends on gate and process-tags
  # Condition: skip if ANY previous job (gate or process-tags) made changes
  update_doc_list:
    name: Update Documentations & Lists
    runs-on: [adn]
    needs: [gate, process-tags]
    if: ${{ needs.gate.outputs.changed != 'true' && needs.process-tags.outputs.changed != 'true' }}
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADN_SECRET_FOEZ_PAT }}

      - name: Update Documentations & Lists
        shell: bash
        run: |
          git submodule update --init --depth 1 submodule/documenter
          make update_doc_list

      - name: Commit and push changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Foez Ahmed"
          git config user.email "foez.official@gmail.com"

          rm -f tagged-files.txt

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Updated Doc list" || true
          git push origin HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Job 3: Regression - depends on all previous jobs
  # Condition: skip if ANY previous job (gate, process-tags, or update_doc_list) made changes
  regression:
    name: Vivado Regression
    runs-on: [adn]
    needs: [gate, process-tags, update_doc_list]
    if: ${{ needs.gate.outputs.changed != 'true' && needs.process-tags.outputs.changed != 'true' && needs.update_doc_list.outputs.changed != 'true' }}

    steps:
      - uses: actions/checkout@v5

      - name: Vivado Regression
        shell: bash
        run: |
          ./regression.sh

      - name: Fail if ci issues
        shell: bash
        run: |
          [[ -s ./log/ci_issues.log ]] && exit 1 || exit 0
